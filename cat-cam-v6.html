<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS單人隱私工具 v7</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            position: relative;
        }
        .camera-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        video {
            display: none; 
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .control-panel {
            width: 100%;
            padding: 12px 15px env(safe-area-inset-bottom);
            background-color: rgba(30, 30, 30, 0.95);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #333;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px 8px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-mask {
            background-color: #555;
            color: white;
        }
        #btn-mask.active {
            background-color: #4caf50;
        }
        #btn-capture {
            background-color: #007aff;
            color: white;
            flex: 1.3; 
        }
        #btn-clear {
            background-color: #ff3b30;
            color: white;
        }
        button:active {
            opacity: 0.8;
        }
        .status-text {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="video" playsinline></video>
        <canvas id="canvas-preview"></canvas>
    </div>

    <div class="control-panel">
        <div class="btn-group">
            <button id="btn-mask">遮蔽: 關</button>
            <button id="btn-capture">拍照</button>
            <button id="btn-clear">清除快取</button>
        </div>
        <div class="status-text" id="status-display">系統準備中...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvasPreview = document.getElementById('canvas-preview');
        const ctxPreview = canvasPreview.getContext('2d');
        
        const btnMask = document.getElementById('btn-mask');
        const btnCapture = document.getElementById('btn-capture');
        const btnClear = document.getElementById('btn-clear');
        const statusDisplay = document.getElementById('status-display');

        let isMasked = false;
        let pose = null;
        let camera = null;

        // 貓咪頭像 SVG DataURL
        const catSvg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <circle cx="50" cy="55" r="40" fill="#fbc02d"/>
                <polygon points="15,25 35,40 15,45" fill="#fbc02d"/>
                <polygon points="15,25 25,35 15,45" fill="#f57f17"/>
                <polygon points="85,25 65,40 85,45" fill="#fbc02d"/>
                <polygon points="85,25 75,35 85,45" fill="#f57f17"/>
                <circle cx="35" cy="50" r="5" fill="#000"/>
                <circle cx="65" cy="50" r="5" fill="#000"/>
                <polygon points="50,60 45,55 55,55" fill="#e91e63"/>
                <path d="M 40,68 Q 45,73 50,68 Q 55,73 60,68" stroke="#000" stroke-width="3" fill="none"/>
                <path d="M 25,60 L 5,58 M 25,63 L 5,65 M 75,60 L 95,58 M 75,63 L 95,65" stroke="#000" stroke-width="2"/>
            </svg>
        `;
        const catImage = new Image();
        catImage.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(catSvg);

        // 初始化 MediaPipe Pose
        async function initPoseDetection() {
            statusDisplay.innerText = "正在初始化後鏡頭與辨識模組...";
            
            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,      
                smoothLandmarks: true,   
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            // 【重大修正】強制設定使用手機後鏡頭 (environment)
            camera = new Camera(video, {
                onFrame: async () => {
                    await pose.send({ image: video });
                },
                width: 1280,
                height: 720,
                facingMode: "environment" // 強制調用後鏡頭
            });
            
            camera.start()
                .then(() => statusDisplay.innerText = "後鏡頭就緒。正面、側面、背面皆可辨識")
                .catch(err => {
                    statusDisplay.innerText = "無法開啟後鏡頭，請檢查 HTTPS 或權限";
                    console.error(err);
                });
        }

        function onPoseResults(results) {
            if (!results.image) return;

            if (canvasPreview.width !== results.image.width || canvasPreview.height !== results.image.height) {
                canvasPreview.width = results.image.width;
                canvasPreview.height = results.image.height;
            }

            // 繪製原始相機畫面
            ctxPreview.drawImage(results.image, 0, 0, canvasPreview.width, canvasPreview.height);

            // 如果開啟遮蔽且有抓到人體骨架
            if (isMasked && results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                const nose = landmarks[0];
                const leftEar = landmarks[7];
                const rightEar = landmarks[8];
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                // 動態計算頭部直徑：利用兩肩寬度的一半作為基準
                const shoulderWidth = Math.hypot(
                    (leftShoulder.x - rightShoulder.x) * canvasPreview.width,
                    (leftShoulder.y - rightShoulder.y) * canvasPreview.height
                );
                
                // 貓頭大小：肩寬的 0.85 倍
                const maskSize = shoulderWidth * 0.85;

                let headX, headY;

                // 判斷正面/側面或背面
                if (nose.visibility > 0.5 || leftEar.visibility > 0.5 || rightEar.visibility > 0.5) {
                    headX = ((leftEar.x + rightEar.x) / 2) * canvasPreview.width;
                    headY = ((leftEar.y + rightEar.y) / 2) * canvasPreview.height;
                    
                    if (nose.visibility > 0.5 && Math.abs(headX - nose.x * canvasPreview.width) > maskSize) {
                        headX = nose.x * canvasPreview.width;
                        headY = nose.y * canvasPreview.height;
                    }
                } else {
                    // 背面模式：利用兩肩中點往上推算頭部位置
                    const shoulderCenterX = (leftShoulder.x + rightShoulder.x) / 2 * canvasPreview.width;
                    const shoulderCenterY = (leftShoulder.y + rightShoulder.y) / 2 * canvasPreview.height;
                    
                    headX = shoulderCenterX;
                    headY = shoulderCenterY - (shoulderWidth * 0.55); // 稍微往下一點點更符合真實背面頭心
                }

                // 取得兩肩最高點的 Y 軸像素座標
                const highestShoulderY = Math.min(leftShoulder.y, rightShoulder.y) * canvasPreview.height;
                
                // 計算貓咪頭左上角的繪製起點
                const maskX = headX - (maskSize / 2);
                let maskY = headY - (maskSize / 2);

                // 【調整防護機制】允許貓咪頭下緣「略低於」肩膀最高點（容許 maskSize 的 15% 覆蓋脖子與鎖骨）
                const maxAllowedY = highestShoulderY + (maskSize * 0.15);
                
                if ((maskY + maskSize) > maxAllowedY) {
                    maskY = maxAllowedY - maskSize;
                }

                // 繪製貓頭
                ctxPreview.drawImage(catImage, maskX, maskY, maskSize, maskSize);
            }
        }

        btnMask.addEventListener('click', () => {
            isMasked = !isMasked;
            if (isMasked) {
                btnMask.innerText = "遮蔽: 開";
                btnMask.classList.add('active');
            } else {
                btnMask.innerText = "遮蔽: 關";
                btnMask.classList.remove('active');
            }
        });

        btnCapture.addEventListener('click', () => {
            statusDisplay.innerText = "正在處理照片儲存...";
            const downloadLink = document.createElement('a');
            const dataUrl = canvasPreview.toDataURL('image/jpeg', 0.9);
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            downloadLink.download = `DNS_${timestamp}.jpg`;
            downloadLink.href = dataUrl;
            downloadLink.click();

            statusDisplay.innerText = "照片已匯出！";

            setTimeout(() => {
                downloadLink.remove();
            }, 100);
        });

        btnClear.addEventListener('click', () => {
            statusDisplay.innerText = "正在重整釋放記憶體...";
            try {
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                canvasPreview.width = 1;
                canvasPreview.height = 1;
                ctxPreview.clearRect(0, 0, 1, 1);
                
                setTimeout(() => {
                    window.location.reload();
                }, 500);
            } catch (error) {
                window.location.reload();
            }
        });

        window.onload = initPoseDetection;
    </script>
</body>
</html>
