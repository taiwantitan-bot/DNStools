<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS單人隱私工具 v10</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            position: relative;
        }
        .camera-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        video {
            display: none; 
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* 暫存預覽與批次下載列 */
        .gallery-container {
            width: 100%;
            height: 95px;
            background-color: #1a1a1a;
            display: flex;
            gap: 10px;
            padding: 8px 15px;
            align-items: center;
            border-top: 1px solid #2a2a2a;
            justify-content: space-between;
        }
        .thumbnails-box {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex: 1;
            height: 100%;
            align-items: center;
        }
        .gallery-item {
            height: 100%;
            aspect-ratio: 3/4;
            background-color: #333;
            border-radius: 4px;
            border: 1px solid #555;
            flex-shrink: 0;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }
        /* 全部下載按鈕（直接輸出圖片檔） */
        #btn-download-all {
            height: 100%;
            padding: 0 15px;
            background-color: #34c759;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: none; /* 有照片時才會顯示 */
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.3);
        }
        /* 控制面板 */
        .control-panel {
            width: 100%;
            padding: 12px 15px env(safe-area-inset-bottom);
            background-color: rgba(30, 30, 30, 0.95);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #333;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px 8px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-mask {
            background-color: #555;
            color: white;
        }
        #btn-mask.active {
            background-color: #4caf50;
        }
        #btn-capture {
            background-color: #007aff;
            color: white;
            flex: 1.3; 
        }
        #btn-clear {
            background-color: #ff3b30;
            color: white;
        }
        button:active {
            opacity: 0.8;
        }
        .status-text {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="video" playsinline></video>
        <canvas id="canvas-preview"></canvas>
    </div>

    <div class="gallery-container">
        <div class="thumbnails-box" id="thumbnails-box"></div>
        <button id="btn-download-all">全部下載<br>(直存相簿)</button>
    </div>

    <div class="control-panel">
        <div class="btn-group">
            <button id="btn-mask">遮蔽: 關</button>
            <button id="btn-capture">拍照</button>
            <button id="btn-clear">清除快取</button>
        </div>
        <div class="status-text" id="status-display">系統準備中...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvasPreview = document.getElementById('canvas-preview');
        const ctxPreview = canvasPreview.getContext('2d');
        
        const btnMask = document.getElementById('btn-mask');
        const btnCapture = document.getElementById('btn-capture');
        const btnClear = document.getElementById('btn-clear');
        const btnDownloadAll = document.getElementById('btn-download-all');
        const thumbnailsBox = document.getElementById('thumbnails-box');
        const statusDisplay = document.getElementById('status-display');

        let isMasked = false;
        let pose = null;
        let camera = null;
        
        // 儲存當前受測者的照片數據
        let localPhotos = []; 

        const catSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="55" r="40" fill="#fbc02d"/><polygon points="15,25 35,40 15,45" fill="#fbc02d"/><polygon points="15,25 25,35 15,45" fill="#f57f17"/><polygon points="85,25 65,40 85,45" fill="#fbc02d"/><polygon points="85,25 75,35 85,45" fill="#f57f17"/><circle cx="35" cy="50" r="5" fill="#000"/><circle cx="65" cy="50" r="5" fill="#000"/><polygon points="50,60 45,55 55,55" fill="#e91e63"/><path d="M 40,68 Q 45,73 50,68 Q 55,73 60,68" stroke="#000" stroke-width="3" fill="none"/><path d="M 25,60 L 5,58 M 25,63 L 5,65 M 75,60 L 95,58 M 75,63 L 95,65" stroke="#000" stroke-width="2"/></svg>`;
        const catImage = new Image();
        catImage.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(catSvg);

        async function initPoseDetection() {
            statusDisplay.innerText = "正在初始化後鏡頭與辨識模組...";
            pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
            pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            pose.onResults(onPoseResults);

            camera = new Camera(video, {
                onFrame: async () => { await pose.send({ image: video }); },
                width: 1280, height: 720, facingMode: "environment"
            });
            
            camera.start()
                .then(() => statusDisplay.innerText = "就緒。請依序連拍四個方向（可在下方即時觀看圖片）")
                .catch(err => { statusDisplay.innerText = "無法開啟鏡頭，請檢查權限"; });
        }

        function onPoseResults(results) {
            if (!results.image) return;
            if (canvasPreview.width !== results.image.width || canvasPreview.height !== results.image.height) {
                canvasPreview.width = results.image.width;
                canvasPreview.height = results.image.height;
            }
            ctxPreview.drawImage(results.image, 0, 0, canvasPreview.width, canvasPreview.height);

            if (isMasked && results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const nose = landmarks[0], leftEar = landmarks[7], rightEar = landmarks[8], leftShoulder = landmarks[11], rightShoulder = landmarks[12];
                const shoulderWidth = Math.hypot((leftShoulder.x - rightShoulder.x) * canvasPreview.width, (leftShoulder.y - rightShoulder.y) * canvasPreview.height);
                const maskSize = shoulderWidth * 0.85;
                let headX, headY;

                if (nose.visibility > 0.5 || leftEar.visibility > 0.5 || rightEar.visibility > 0.5) {
                    headX = ((leftEar.x + rightEar.x) / 2) * canvasPreview.width;
                    headY = ((leftEar.y + rightEar.y) / 2) * canvasPreview.height;
                    if (nose.visibility > 0.5 && Math.abs(headX - nose.x * canvasPreview.width) > maskSize) {
                        headX = nose.x * canvasPreview.width; headY = nose.y * canvasPreview.height;
                    }
                } else {
                    headX = (leftShoulder.x + rightShoulder.x) / 2 * canvasPreview.width;
                    headY = ((leftShoulder.y + rightShoulder.y) / 2 * canvasPreview.height) - (shoulderWidth * 0.55);
                }

                const highestShoulderY = Math.min(leftShoulder.y, rightShoulder.y) * canvasPreview.height;
                const maskX = headX - (maskSize / 2);
                let maskY = headY - (maskSize / 2);
                const maxAllowedY = highestShoulderY + (maskSize * 0.15);
                if ((maskY + maskSize) > maxAllowedY) { maskY = maxAllowedY - maskSize; }

                ctxPreview.drawImage(catImage, maskX, maskY, maskSize, maskSize);
            }
        }

        btnMask.addEventListener('click', () => {
            isMasked = !isMasked;
            btnMask.innerText = isMasked ? "遮蔽: 開" : "遮蔽: 關";
            btnMask.className = isMasked ? "active" : "";
        });

        // 1. 拍照按鈕：純暫存，下方即時顯示大縮圖，方便當下檢查
        btnCapture.addEventListener('click', () => {
            const dataUrl = canvasPreview.toDataURL('image/jpeg', 0.85); 
            localPhotos.push(dataUrl);

            // 產生即時預覽縮圖
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-item';
            const img = document.createElement('img');
            img.src = dataUrl;
            wrapper.appendChild(img);
            thumbnailsBox.appendChild(wrapper);

            // 鏡頭拍完自動將預覽列滾動到最新照片
            thumbnailsBox.scrollLeft = thumbnailsBox.scrollWidth;

            // 顯示「全部下載」按鈕
            if (localPhotos.length > 0) {
                btnDownloadAll.style.display = 'flex';
            }

            statusDisplay.innerText = `已拍攝 ${localPhotos.length} 個方向，可在下方即時點檢圖片`;
        });

        // 2. 全部下載按鈕：直接批次導出圖片檔，不打包 ZIP，並在下載後自動清除
        btnDownloadAll.addEventListener('click', () => {
            if (localPhotos.length === 0) return;

            statusDisplay.innerText = "正在批次匯出圖片，請連續確認儲存提示...";
            
            const directions = ["1_正面", "2_左側", "3_右側", "4_背面"];
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(11, 19);

            // 利用時差依序觸發標準圖片下載
            localPhotos.forEach((dataUrl, index) => {
                setTimeout(() => {
                    const downloadLink = document.createElement('a');
                    const prefix = index < directions.length ? directions[index] : `${index + 1}_額外照片`;
                    
                    downloadLink.download = `DNS_${prefix}_${timestamp}.jpg`;
                    downloadLink.href = dataUrl;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    
                    // 釋放節點
                    document.body.removeChild(downloadLink);
                }, index * 250); // 每張隔 250 毫秒，防止瀏覽器阻擋多重下載
            });

            // 下載完成後，立馬清空，防止下一位受測者重複下載舊照片
            setTimeout(() => {
                localPhotos = [];
                thumbnailsBox.innerHTML = '';
                btnDownloadAll.style.display = 'none';
                statusDisplay.innerText = "匯出完成！已自動重置暫存區。";
            }, localPhotos.length * 260);
        });

        // 完全重置
        btnClear.addEventListener('click', () => {
            statusDisplay.innerText = "重置中...";
            localPhotos = [];
            thumbnailsBox.innerHTML = '';
            if ('caches' in window) {
                caches.keys().then(names => { names.forEach(name => caches.delete(name)); });
            }
            canvasPreview.width = 1; canvasPreview.height = 1;
            setTimeout(() => { window.location.reload(); }, 300);
        });

        window.onload = initPoseDetection;
    </script>
</body>
</html>
